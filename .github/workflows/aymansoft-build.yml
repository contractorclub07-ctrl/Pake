
name: Build AymanSoft EXE and MSI

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.26.2"

on:
  workflow_dispatch:
    inputs:
      url:
        description: "AymanSoft website URL"
        required: true
        default: "https://aymansoft.freebuff.page/settings"
        type: string

      name:
        description: "Application name"
        required: true
        default: "AYMANSOFT"
        type: string

      icon:
        description: "Application icon URL (optional)"
        required: false
        default: ""
        type: string

      width:
        description: "Window width"
        required: true
        default: "1366"
        type: string

      height:
        description: "Window height"
        required: true
        default: "900"
        type: string

      app_version:
        description: "Application version"
        required: true
        default: "1.0.0"
        type: string

      fullscreen:
        description: "Start in fullscreen"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: aymansoft-windows-build
  cancel-in-progress: false

jobs:
  build:
    name: Build AymanSoft for Windows
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js Environment
        uses: ./.github/actions/setup-env
        with:
          mode: build

      - name: Build Pake CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pnpm run cli:build

          if ($LASTEXITCODE -ne 0) {
            throw "Pake CLI compilation failed."
          }

      - name: Validate build inputs
        shell: pwsh
        env:
          APP_URL: ${{ inputs.url }}
          APP_NAME: ${{ inputs.name }}
          APP_WIDTH: ${{ inputs.width }}
          APP_HEIGHT: ${{ inputs.height }}
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:APP_URL -notmatch '^https?://') {
            throw "Invalid application URL."
          }

          if ($env:APP_NAME -notmatch '^[A-Za-z0-9_-]+$') {
            throw "Invalid application name."
          }

          $width = 0
          $height = 0

          if (-not [int]::TryParse($env:APP_WIDTH, [ref]$width)) {
            throw "Invalid window width."
          }

          if (-not [int]::TryParse($env:APP_HEIGHT, [ref]$height)) {
            throw "Invalid window height."
          }

          if ($width -lt 400 -or $height -lt 300) {
            throw "Window dimensions are too small."
          }

          if ($env:APP_VERSION -notmatch '^\d+\.\d+\.\d+([.-][A-Za-z0-9.-]+)?$') {
            throw "Invalid application version."
          }

          if (-not (Test-Path "dist/cli.js")) {
            throw "Pake CLI output not found."
          }

          Write-Host "All build inputs are valid."

      - name: Build AymanSoft
        shell: pwsh
        env:
          APP_URL: ${{ inputs.url }}
          APP_NAME: ${{ inputs.name }}
          APP_ICON: ${{ inputs.icon }}
          APP_WIDTH: ${{ inputs.width }}
          APP_HEIGHT: ${{ inputs.height }}
          APP_VERSION: ${{ inputs.app_version }}
          APP_FULLSCREEN: ${{ inputs.fullscreen }}
        run: |
          $ErrorActionPreference = "Stop"

          $buildArgs = @(
            $env:APP_URL,
            "--name", $env:APP_NAME,
            "--width", $env:APP_WIDTH,
            "--height", $env:APP_HEIGHT,
            "--app-version", $env:APP_VERSION,
            "--keep-binary"
          )

          if (-not [string]::IsNullOrWhiteSpace($env:APP_ICON)) {
            $buildArgs += @("--icon", $env:APP_ICON)
          }

          if ($env:APP_FULLSCREEN -eq "true") {
            $buildArgs += "--fullscreen"
          }

          Write-Host "Building $env:APP_NAME..."

          node dist/cli.js @buildArgs

          if ($LASTEXITCODE -ne 0) {
            throw "Pake build failed."
          }

          Write-Host "Pake build command completed."

      - name: Collect and verify build files
        shell: pwsh
        env:
          APP_NAME: ${{ inputs.name }}
        run: |
          $ErrorActionPreference = "Stop"

          $exePath = Join-Path $PWD "$($env:APP_NAME).exe"

          if (-not (Test-Path $exePath -PathType Leaf)) {
            throw "Raw EXE was not generated: $exePath"
          }

          $exe = Get-Item $exePath

          if ($exe.Length -le 0) {
            throw "Generated EXE is empty."
          }

          $msiFiles = @(Get-ChildItem -Path $PWD -Filter "*.msi" -File)

          if ($msiFiles.Count -eq 0) {
            throw "No MSI installer was generated. Check Tauri Windows bundle configuration."
          }

          foreach ($msi in $msiFiles) {
            if ($msi.Length -le 0) {
              throw "MSI installer is empty: $($msi.Name)"
            }
          }

          New-Item -ItemType Directory -Force -Path "release-files" | Out-Null

          Copy-Item $exe.FullName "release-files/$($env:APP_NAME).exe"

          foreach ($msi in $msiFiles) {
            Copy-Item $msi.FullName "release-files/$($msi.Name)"
          }

          Write-Host "Verified release files:"
          Get-ChildItem "release-files" | Select-Object Name, Length

      - name: Upload AymanSoft EXE
        uses: actions/upload-artifact@v6
        with:
          name: AYMANSOFT-EXE
          path: release-files/${{ inputs.name }}.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload AymanSoft MSI Installer
        uses: actions/upload-artifact@v6
        with:
          name: AYMANSOFT-MSI-INSTALLER
          path: release-files/*.msi
          if-no-files-found: error
          retention-days: 14

      - name: Build Summary
        if: success()
        shell: pwsh
        env:
          APP_NAME: ${{ inputs.name }}
          APP_VERSION: ${{ inputs.app_version }}
          APP_URL: ${{ inputs.url }}
        run: |
          "## AymanSoft Build Successful" >> $env:GITHUB_STEP_SUMMARY
          "- Application: $env:APP_NAME" >> $env:GITHUB_STEP_SUMMARY
          "- Version: $env:APP_VERSION" >> $env:GITHUB_STEP_SUMMARY
          "- URL: $env:APP_URL" >> $env:GITHUB_STEP_SUMMARY
          "- EXE: $env:APP_NAME.exe" >> $env:GITHUB_STEP_SUMMARY
          "- MSI: Windows Installer" >> $env:GITHUB_STEP_SUMMARY
          "- Status: SUCCESS" >> $env:GITHUB_STEP_SUMMARY
