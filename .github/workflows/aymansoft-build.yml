name: Build AymanSoft EXE and MSI

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.26.2"

on:
  workflow_dispatch:
    inputs:
      url:
        description: "AymanSoft website URL"
        required: true
        default: "https://aymansoft.freebuff.page/settings"
        type: string

      name:
        description: "Application name (use letters, numbers, hyphens or underscores)"
        required: true
        default: "AYMANSOFT"
        type: string

      icon:
        description: "Application icon URL (optional)"
        required: false
        default: ""
        type: string

      width:
        description: "Window width"
        required: true
        default: "1366"
        type: string

      height:
        description: "Window height"
        required: true
        default: "900"
        type: string

      app_version:
        description: "Application version"
        required: true
        default: "1.0.0"
        type: string

      fullscreen:
        description: "Start in fullscreen"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: aymansoft-windows-build
  cancel-in-progress: false

jobs:
  build:
    name: Build AymanSoft for Windows
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js Environment
        uses: ./.github/actions/setup-env
        with:
          mode: build

      - name: Build Pake CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pnpm run cli:build
          if ($LASTEXITCODE -ne 0) {
            throw "Pake CLI compilation failed."
          }

      - name: Validate build inputs
        shell: pwsh
        env:
          APP_URL: ${{ inputs.url }}
          APP_NAME: ${{ inputs.name }}
          APP_WIDTH: ${{ inputs.width }}
          APP_HEIGHT: ${{ inputs.height }}
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:APP_URL -notmatch '^https?://') {
            throw "Invalid application URL."
          }

          if ($env:APP_NAME -notmatch '^[A-Za-z0-9_-]+$') {
            throw "Application name can only contain letters, numbers, hyphens and underscores."
          }

          if ([int]$env:APP_WIDTH -lt 400 -or [int]$env:APP_HEIGHT -lt 300) {
            throw "Window dimensions are too small."
          }

          if ($env:APP_VERSION -notmatch '^\d+\.\d+\.\d+([.-][A-Za-z0-9.-]+)?$') {
            throw "Invalid application version."
          }

          if (-not (Test-Path "dist/cli.js")) {
            throw "Pake CLI output dist/cli.js was not found."
          }

          Write-Host "Build inputs validated successfully."

      - name: Build AymanSoft EXE and MSI
        shell: pwsh
        env:
          APP_URL: ${{ inputs.url }}
          APP_NAME: ${{ inputs.name }}
          APP_ICON: ${{ inputs.icon }}
          APP_WIDTH: ${{ inputs.width }}
          APP_HEIGHT: ${{ inputs.height }}
          APP_VERSION: ${{ inputs.app_version }}
          APP_FULLSCREEN: ${{ inputs.fullscreen }}
        run: |
          $ErrorActionPreference = "Stop"

          $buildArgs = @(
            $env:APP_URL,
            "--name", $env:APP_NAME,
            "--width", $env:APP_WIDTH,
            "--height", $env:APP_HEIGHT,
            "--app-version", $env:APP_VERSION,
            "--keep-binary"
          )

          if (-not [string]::IsNullOrWhiteSpace($env:APP_ICON)) {
            $buildArgs += @("--icon", $env:APP_ICON)
          }

          if ($env:APP_FULLSCREEN -eq "true") {
            $buildArgs += "--fullscreen"
          }

          Write-Host "Starting AymanSoft build..."
          Write-Host "Application: $env:APP_NAME"
          Write-Host "Version: $env:APP_VERSION"

          node dist/cli.js @buildArgs

          if ($LASTEXITCODE -ne 0) {
            throw "Pake CLI build failed."
          }

          Write-Host "Checking generated Windows packages..."

          $exePath = Join-Path $PWD "$($env:APP_NAME).exe"
          $msiFiles = @(Get-ChildItem -Path $PWD -Filter "*.msi" -File)

          if (-not (Test-Path $exePath -PathType Leaf)) {
            throw "EXE file was not generated: $exePath"
          }

          if ((Get-Item $exePath).Length -le 0) {
            throw "Generated EXE file is empty."
          }

          if ($msiFiles.Count -eq 0) {
            throw "No MSI installer was generated."
          }

          foreach ($msi in $msiFiles) {
            if ($msi.Length -le 0) {
              throw "MSI installer is empty: $($msi.Name)"
            }
          }

          Write-Host "EXE and MSI files verified successfully."

          Get-Item $exePath | Select-Object Name, Length
          $msiFiles | Select-Object Name, Length

      - name: Upload AymanSoft EXE
        uses: actions/upload-artifact@v6
        with:
          name: AYMANSOFT-EXE
          path: ${{ inputs.name }}.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload AymanSoft MSI Installer
        uses: actions/upload-artifact@v6
        with:
          name: AYMANSOFT-MSI-INSTALLER
          path: "*.msi"
          if-no-files-found: error
          retention-days: 14

      - name: Build Summary
        if: success()
        shell: pwsh
        env:
          APP_NAME: ${{ inputs.name }}
          APP_VERSION: ${{ inputs.app_version }}
          APP_URL: ${{ inputs.url }}
        run: |
          "## AymanSoft Build Successful" >> $env:GITHUB_STEP_SUMMARY
          "- Application: $env:APP_NAME" >> $env:GITHUB_STEP_SUMMARY
          "- Version: $env:APP_VERSION" >> $env:GITHUB_STEP_SUMMARY
          "- URL: $env:APP_URL" >> $env:GITHUB_STEP_SUMMARY
          "- EXE: $env:APP_NAME.exe" >> $env:GITHUB_STEP_SUMMARY
          "- MSI: Windows Installer" >> $env:GITHUB_STEP_SUMMARY
          "- Status: SUCCESS" >> $env:GITHUB_STEP_SUMMARY
          
