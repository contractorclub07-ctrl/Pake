
name: Build AymanSoft EXE

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.26.2"

on:
  workflow_dispatch:
    inputs:
      url:
        description: "AymanSoft website URL"
        required: true
        default: "https://aymansoft.freebuff.page/settings"
        type: string

      name:
        description: "Application name"
        required: true
        default: "AYMANSOFT"
        type: string

      width:
        description: "Window width"
        required: true
        default: "1366"
        type: string

      height:
        description: "Window height"
        required: true
        default: "900"
        type: string

      app_version:
        description: "Application version"
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build AymanSoft for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js Environment
        uses: ./.github/actions/setup-env
        with:
          mode: build

      - name: Build CLI
        run: pnpm run cli:build

      - name: Build AymanSoft
        shell: pwsh
        env:
          APP_URL: ${{ inputs.url }}
          APP_NAME: ${{ inputs.name }}
          APP_WIDTH: ${{ inputs.width }}
          APP_HEIGHT: ${{ inputs.height }}
          APP_VERSION: ${{ inputs.app_version }}

        run: |
          $buildArgs = @(
            $env:APP_URL,
            "--name", $env:APP_NAME,
            "--width", $env:APP_WIDTH,
            "--height", $env:APP_HEIGHT,
            "--app-version", $env:APP_VERSION,
            "--keep-binary"
          )

          Write-Host "Building AymanSoft..."

          node dist/cli.js @buildArgs

          if ($LASTEXITCODE -ne 0) {
            throw "Build failed!"
          }

          Write-Host "Build completed successfully."

      - name: Upload AymanSoft EXE
        uses: actions/upload-artifact@v6
        with:
          name: AYMANSOFT-EXE
          path: AYMANSOFT.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload AymanSoft MSI
        uses: actions/upload-artifact@v6
        with:
          name: AYMANSOFT-INSTALLER
          path: "*.msi"
          if-no-files-found: error
          retention-days: 7
